<style>
  :root{ --void:#06080B; --bone:#F5F3EC; --signal:#5FD0FF; --line:rgba(245,243,236,.14); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--void); color:var(--bone);
    font-family:"Inter",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .wrap{ max-width:520px; }
  .tag{
    font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:.1em;

  }
  h1{ font-family:"Space Grotesk",sans-serif; font-size:clamp(2rem,7vw,3rem); margin:0 0 16px; }
  p{ color:#B9C1CC; line-height:1.6; margin:0 0 30px; }
  a.btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:100px;
    background:var(--signal); color:var(--void); text-decoration:none;
    font-family:"JetBrains Mono",monospace; font-size:13px;
  }
  .verts{ display:flex; gap:8px; justify-content:center; margin-bottom:26px; }
  .verts span{ width:10px; height:10px; border-radius:50%; background:var(--line); }
  .verts span:nth-child(3){ background:#FF6A3D; box-shadow:0 0 10px #FF6A3D; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="verts"><span></span><span></span><span></span><span></span><span></span></div>

  </div>
</body>
